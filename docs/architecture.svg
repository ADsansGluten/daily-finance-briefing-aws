<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" width="1100" height="600" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrowr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
    <marker id="arrowv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b21b6"/>
    </marker>
  </defs>
  <rect width="1100" height="600" fill="#ffffff"/>
  <text x="40" y="34" font-size="20" font-weight="700" fill="#0f172a">Briefing finance quotidien - architecture AWS (eu-west-1)</text>

  <!-- RSS -->
  <rect x="40" y="60" width="210" height="90" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text x="145" y="92" font-size="15" font-weight="700" text-anchor="middle" fill="#0f172a">Flux RSS publics</text>
  <text x="145" y="114" font-size="12.5" text-anchor="middle" fill="#334155">Le Monde · BBC</text>
  <text x="145" y="132" font-size="12.5" text-anchor="middle" fill="#334155">CNBC · BCE</text>

  <!-- Scheduler -->
  <rect x="40" y="200" width="210" height="90" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text x="145" y="232" font-size="15" font-weight="700" text-anchor="middle" fill="#0f172a">EventBridge Scheduler</text>
  <text x="145" y="254" font-size="12.5" text-anchor="middle" fill="#334155">7h00, lundi au vendredi</text>
  <text x="145" y="272" font-size="12.5" text-anchor="middle" fill="#334155">fuseau Europe/Paris</text>

  <!-- Lambda main -->
  <rect x="400" y="200" width="220" height="90" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="510" y="230" font-size="15" font-weight="700" text-anchor="middle" fill="#0f172a">Lambda</text>
  <text x="510" y="250" font-size="13" font-weight="600" text-anchor="middle" fill="#0f172a">daily-finance-briefing</text>
  <text x="510" y="270" font-size="12" text-anchor="middle" fill="#334155">collecte, filtre, résume, publie</text>

  <!-- Bedrock -->
  <rect x="780" y="40" width="280" height="100" rx="10" fill="#f5f3ff" stroke="#5b21b6" stroke-width="3"/>
  <text x="920" y="73" font-size="16" font-weight="700" text-anchor="middle" fill="#3b0764">Amazon Bedrock</text>
  <text x="920" y="95" font-size="13" text-anchor="middle" fill="#3b0764">Nova 2 Lite (profil d'inférence EU)</text>
  <text x="920" y="115" font-size="12" text-anchor="middle" fill="#5b21b6">résumé en français, sources citées</text>

  <!-- SES -->
  <rect x="780" y="200" width="280" height="90" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text x="920" y="232" font-size="15" font-weight="700" text-anchor="middle" fill="#0f172a">Amazon SES</text>
  <text x="920" y="254" font-size="12.5" text-anchor="middle" fill="#334155">e-mail du briefing</text>
  <text x="920" y="272" font-size="12.5" text-anchor="middle" fill="#334155">avec lien vers la page web</text>

  <!-- S3 -->
  <rect x="780" y="340" width="280" height="90" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text x="920" y="372" font-size="15" font-weight="700" text-anchor="middle" fill="#0f172a">Amazon S3</text>
  <text x="920" y="394" font-size="12.5" text-anchor="middle" fill="#334155">briefings/AAAA-MM-JJ.html + .json</text>
  <text x="920" y="412" font-size="12.5" text-anchor="middle" fill="#334155">briefings/latest.html</text>

  <!-- Viewer -->
  <rect x="400" y="470" width="220" height="90" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="510" y="500" font-size="15" font-weight="700" text-anchor="middle" fill="#0f172a">Lambda</text>
  <text x="510" y="520" font-size="13" font-weight="600" text-anchor="middle" fill="#0f172a">briefing-viewer</text>
  <text x="510" y="540" font-size="12" text-anchor="middle" fill="#334155">Function URL publique</text>

  <!-- Browser -->
  <rect x="40" y="470" width="210" height="90" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text x="145" y="505" font-size="15" font-weight="700" text-anchor="middle" fill="#0f172a">Navigateur</text>
  <text x="145" y="527" font-size="12.5" text-anchor="middle" fill="#334155">page web du briefing</text>


  <!-- CloudWatch alarme -->
  <rect x="380" y="335" width="180" height="85" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
  <text x="470" y="365" font-size="15" font-weight="700" text-anchor="middle" fill="#134e4a">CloudWatch</text>
  <text x="470" y="386" font-size="12.5" text-anchor="middle" fill="#134e4a">alarme sur Errors</text>
  <text x="470" y="404" font-size="12" text-anchor="middle" fill="#0f766e">seuil &gt;= 1 (5 min)</text>

  <!-- SNS -->
  <rect x="40" y="335" width="210" height="85" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
  <text x="145" y="365" font-size="15" font-weight="700" text-anchor="middle" fill="#134e4a">Amazon SNS</text>
  <text x="145" y="386" font-size="12.5" text-anchor="middle" fill="#134e4a">alertes-briefing</text>
  <text x="145" y="404" font-size="12" text-anchor="middle" fill="#0f766e">e-mail si la Lambda échoue</text>

  <path d="M 470 290 L 470 333" fill="none" stroke="#0f766e" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowr)"/>
  <text x="482" y="317" font-size="12" fill="#0f766e">métrique</text>
  <path d="M 380 377 L 252 377" fill="none" stroke="#0f766e" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowr)"/>
  <text x="316" y="369" font-size="12" text-anchor="middle" fill="#0f766e">notifie</text>

  <!-- Arrows -->
  <path d="M 145 150 L 145 175 L 510 175 L 510 198" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="330" y="168" font-size="12" text-anchor="middle" fill="#334155">titres + résumés</text>

  <path d="M 250 245 L 398 245" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="324" y="237" font-size="12" text-anchor="middle" fill="#334155">déclenche</text>

  <path d="M 600 200 L 600 90 L 778 90" fill="none" stroke="#5b21b6" stroke-width="3" marker-end="url(#arrowv)"/>
  <text x="690" y="82" font-size="12" text-anchor="middle" fill="#5b21b6">prompt + articles</text>

  <path d="M 620 245 L 778 245" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="699" y="237" font-size="12" text-anchor="middle" fill="#334155">envoie</text>

  <path d="M 600 290 L 600 385 L 778 385" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="690" y="377" font-size="12" text-anchor="middle" fill="#334155">écrit</text>

  <path d="M 250 515 L 398 515" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="324" y="507" font-size="12" text-anchor="middle" fill="#334155">HTTPS</text>

  <path d="M 620 515 L 920 515 L 920 432" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="770" y="507" font-size="12" text-anchor="middle" fill="#334155">lit (s3:GetObject)</text>

  <text x="40" y="592" font-size="12" fill="#475569">Deux rôles IAM séparés : le viewer public n'a que s3:GetObject ; le briefing peut écrire sur S3, envoyer par SES et appeler Bedrock. Traits pointillés : supervision.</text>
</svg>
